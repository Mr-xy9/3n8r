; إعدادات PlatformIO لجهاز ESP32
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    links2004/WebSockets@^2.4.1
build_flags =
    -DDEVICE_ID=\"esp32-001\"
    -DDEVICE_TOKEN=\"replace-with-real-token\"
    -DSERVER_HOST=\"10.20.40.135\"
    -DSERVER_PORT=3000
    -DUSE_TLS=0
