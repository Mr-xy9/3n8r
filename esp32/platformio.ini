; إعدادات PlatformIO لجهاز ESP32
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    timum-viw/socket.io-client@^2.0.0
build_flags =
    -DDEVICE_ID=\"esp32-001\"
    -DDEVICE_TOKEN=\"replace-with-real-token\"
    -DSERVER_HOST=\"192.168.1.10\"
    -DSERVER_PORT=3000
    -DUSE_TLS=0
