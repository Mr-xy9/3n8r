<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام التنبيهات — تسجيل الدخول</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-bg">
  <main class="login-card">
    <h1>🛡️ نظام التنبيهات المدنية</h1>
    <p class="muted">Civil Defense Alert System</p>
    <form id="login-form" method="post" action="javascript:void(0);" autocomplete="on">
      <label>اسم المستخدم
        <input id="username" name="username" required autocomplete="username" />
      </label>
      <label>كلمة المرور
        <input id="password" name="password" type="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary" id="login-btn">تسجيل الدخول</button>
      <p class="error" id="login-error" hidden></p>
      <p class="muted" style="text-align:center;margin-top:0.5rem">
        المستخدم الافتراضي: <code>admin</code> / <code>admin123</code>
      </p>
    </form>
  </main>
  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
