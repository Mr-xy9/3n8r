<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام التنبيهات — تسجيل الدخول</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-bg">
  <main class="login-card">
    <h1>🛡️ نظام التنبيهات المدنية</h1>
    <p class="muted">Civil Defense Alert System</p>
    <form id="login-form">
      <label>اسم المستخدم<input name="username" required autocomplete="username" /></label>
      <label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" /></label>
      <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
      <p class="error" id="login-error" hidden></p>
    </form>
  </main>
  <script src="app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errEl = document.getElementById('login-error');
      errEl.hidden = true;
      try {
        const res = await api.login(fd.get('username'), fd.get('password'));
        auth.save(res);
        location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'فشل تسجيل الدخول';
        errEl.hidden = false;
      }
    });
    if (auth.token()) location.href = 'dashboard.html';
  </script>
</body>
</html>
